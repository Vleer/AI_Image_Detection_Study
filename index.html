<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Image Perception Study</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>&#128065;</text></svg>">
<script>
/* Resolve the theme before first paint so there is no flash: an explicit
   choice from localStorage wins, otherwise follow the OS setting. */
(function () {
  var t = null;
  try { t = localStorage.getItem('raic-theme'); } catch (e) {}
  if (t !== 'light' && t !== 'dark') {
    t = (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
  }
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<a class="skip-link" href="#screen">Skip to content</a>

<div id="app" class="app">
  <header class="topbar" id="topbar" hidden>
    <div class="topbar__brand">
      <span class="topbar__logo" aria-hidden="true">&#128065;</span>
      <span>Image Perception Study</span>
    </div>
    <div class="topbar__progress" id="topbarProgress" hidden>
      <div class="progressbar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Study progress">
        <div class="progressbar__fill" id="progressFill"></div>
      </div>
      <span class="topbar__step" id="progressLabel"></span>
    </div>
    <button type="button" class="theme-toggle" id="themeToggle" aria-label="Switch to light theme" title="Switch theme">
      <svg class="theme-toggle__icon theme-toggle__icon--moon" viewBox="0 0 24 24" width="17" height="17" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <svg class="theme-toggle__icon theme-toggle__icon--sun" viewBox="0 0 24 24" width="17" height="17" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
    </button>
  </header>

  <main id="screen" class="screen" tabindex="-1"></main>

  <footer class="footer" id="footer">
    <span id="footerNote">Participant session &middot; data stored locally in your browser</span>
  </footer>
</div>

<!-- Full-screen correctness feedback for the training phase -->
<div id="feedback" class="feedback" aria-live="assertive" aria-atomic="true" hidden>
  <div class="feedback__inner">
    <div class="feedback__icon" id="feedbackIcon"></div>
    <div class="feedback__title" id="feedbackTitle"></div>
    <div class="feedback__sub" id="feedbackSub"></div>
  </div>
</div>

<!-- Load order matters: these are plain scripts, no bundler required. -->
<script src="js/rng.js"></script>
<script src="js/config.js"></script>
<script src="js/dummy-images.js"></script>
<script src="js/photo-manifest.js"></script>
<script src="js/stimuli.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/theme.js"></script>
<script src="js/screens/welcome.js"></script>
<script src="js/screens/consent.js"></script>
<script src="js/screens/demographics.js"></script>
<script src="js/screens/instructions.js"></script>
<script src="js/screens/judgement.js"></script>
<script src="js/screens/priming.js"></script>
<script src="js/screens/questionnaire.js"></script>
<script src="js/screens/debrief.js"></script>
<script src="js/app.js"></script>
</body>
</html>
